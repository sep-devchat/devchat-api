services:
  devchat-api_mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - ${DB_PORT}:3306
    volumes:
      - devchat-api_db_vol:/var/lib/mysql
    networks:
      - devchat-api_net

  devchat-api_dind:
    image: docker:dind
    hostname: dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./dind-client-certs:/certs/client
      - ./code-execution-tmp:/app/code-execution-tmp
    networks:
      devchat-api_net:
        aliases:
          - dind

networks:
  devchat-api_net:
    name: devchat-api_net
    driver: bridge

volumes:
  devchat-api_db_vol:
